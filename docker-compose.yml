services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

  odoo:
    image: odoo:19.0
    depends_on:
      - db
    ports:
      - "8069:8069"
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${DB_PASSWORD}
    volumes:
      - odoo-data:/var/lib/odoo
      - ./addons:/mnt/extra-addons
    restart: unless-stopped

  # Alat backup dan restore. Tidak ikut menyala saat "docker compose up".
  # Cara pakai ada di README bagian Backup dan restore.
  backup:
    image: postgres:16
    profiles: ["alat"]
    depends_on:
      - db
    environment:
      PGHOST: db
      PGUSER: odoo
      PGPASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-pavrental}
      SIMPAN_HARI: ${SIMPAN_HARI:-14}
      TZ: Asia/Makassar
    volumes:
      - odoo-data:/var/lib/odoo
      - ./backups:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["bash"]

volumes:
  db-data:
  odoo-data: